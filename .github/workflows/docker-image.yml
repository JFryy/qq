name: ci

on:
  push:
    branches:
      - 'main'
      - 'develop'
  workflow_call:
    inputs:
      version:
        description: "Release tag to build and publish, e.g. v1.2.3"
        type: string
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Check out code
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jfryy/qq
          flavor: latest=false
          tags: |
            type=sha,prefix={{branch}}-,format=long,enable=${{ inputs.version == '' }}
            type=raw,value={{branch}}-latest,enable=${{ inputs.version == '' }}
            type=semver,pattern=v{{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version || format('{0}-{1}', github.ref_name, github.sha) }}
