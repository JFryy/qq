name: "Go Build Make Test"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      run: time go test -v ./...

    - name: MakeTest
      run: time make test

    - name: Verify version injection
      run: |
        make build VERSION=v0.0.0-ci
        test "$(./bin/qq --version)" = "qq version v0.0.0-ci"

    - name: Release validation regression tests
      run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

    - name: GoReleaser config check
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: "~> v2"
        args: check

    - name: GoReleaser snapshot build
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: "~> v2"
        args: build --snapshot --clean
